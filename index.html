<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jon's Site</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0f0f1a;
      color: #e8e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px 20px;
    }

    .container {
      max-width: 560px;
      width: 100%;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #6b6b80;
      font-size: 0.9rem;
      margin-bottom: 40px;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b6b80;
      margin-bottom: 12px;
    }

    ul {
      list-style: none;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 32px;
    }

    li a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      color: #e8e8f0;
      text-decoration: none;
      background-color: #1e1e32;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      transition: background-color 0.15s ease;
      min-height: 52px;
    }

    li:last-child a {
      border-bottom: none;
    }

    li a:hover {
      background-color: #252540;
    }

    li a:focus {
      outline: 2px solid #6366f1;
      outline-offset: -2px;
    }

    .arrow {
      color: #6b6b80;
      font-size: 1rem;
    }
  </style>
</head>
<body>

      <li><a href="tools/quadratic-explorer/">Quadratic Graph Explorer <span class="arrow">›</span></a></li>
      <li><a href="tools/retirement-calculator/">Retirement Calculator <span class="arrow">›</span></a></li>
