<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Travel Map — Jon's Site</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root[data-theme="dark"] {
    --bg: oklch(0.165 0.012 256);
    --bg-2: oklch(0.205 0.014 256);
    --bg-3: oklch(0.255 0.016 256);
    --text: oklch(0.945 0.006 256);
    --text-soft: oklch(0.70 0.012 256);
    --text-faint: oklch(0.54 0.012 256);
    --line: oklch(0.95 0.006 256 / 0.10);
    --line-2: oklch(0.95 0.006 256 / 0.05);
    --accent: oklch(0.76 0.13 308);
    --accent-dim: oklch(0.76 0.13 308 / 0.14);
    --glow: oklch(0.76 0.13 308 / 0.28);
  }
  :root[data-theme="light"] {
    --bg: oklch(0.985 0.004 256);
    --bg-2: oklch(0.97 0.005 256);
    --bg-3: oklch(0.93 0.007 256);
    --text: oklch(0.22 0.014 256);
    --text-soft: oklch(0.44 0.013 256);
    --text-faint: oklch(0.60 0.012 256);
    --line: oklch(0.22 0.014 256 / 0.13);
    --line-2: oklch(0.22 0.014 256 / 0.06);
    --accent: oklch(0.55 0.16 305);
    --accent-dim: oklch(0.55 0.16 305 / 0.10);
    --glow: oklch(0.55 0.16 305 / 0.18);
  }

  :root {
    --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
    --display: "Sora", "Geist", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --maxw: 1180px;
    --gutter: clamp(20px, 5vw, 56px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.6;
    font-weight: 400;
    overflow-x: hidden;
    transition: background .4s ease, color .4s ease;
  }

  ::selection { background: var(--accent); color: var(--bg); }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gutter); }
  .mono { font-family: var(--mono); }

  .tag {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--accent);
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .tag::before { content: ""; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--glow); }

  /* NAV */
  header {
    position: sticky; top: 0; z-index: 60;
    background: color-mix(in oklch, var(--bg) 80%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid transparent;
    transition: border-color .3s ease;
  }
  header.scrolled { border-bottom-color: var(--line); }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { display: flex; align-items: center; gap: 11px; font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--accent); color: var(--bg);
    display: grid; place-items: center;
    font-family: var(--mono); font-size: 13px; font-weight: 500;
    box-shadow: 0 0 18px var(--glow);
  }
  .nav-links { display: flex; align-items: center; gap: 4px; }
  .nav-links a {
    font-family: var(--mono); font-size: 13px; color: var(--text-soft);
    padding: 8px 13px; border-radius: 8px;
    transition: color .2s ease, background .2s ease;
  }
  .nav-links a:hover { color: var(--text); background: var(--bg-2); }
  .nav-tools { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--bg-2);
    color: var(--text-soft); cursor: pointer;
    display: grid; place-items: center;
    transition: color .2s, border-color .2s, background .2s;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn svg { width: 17px; height: 17px; }
  @media (max-width: 720px) { .nav-links { display: none; } }

  /* PAGE HERO */
  .page-hero {
    padding-top: clamp(48px, 7vw, 88px);
    padding-bottom: clamp(32px, 5vw, 56px);
  }
  .page-hero .breadcrumb {
    font-family: var(--mono); font-size: 12px; color: var(--text-faint);
    margin-bottom: 20px;
  }
  .page-hero .breadcrumb a { color: var(--accent); }
  .page-hero .breadcrumb a:hover { text-decoration: underline; }
  .page-hero h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(28px, 3.6vw, 46px);
    line-height: 1.08;
    letter-spacing: -0.02em;
    margin-top: 16px;
  }
  .page-hero p {
    color: var(--text-soft);
    font-size: clamp(15px, 1.8vw, 18px);
    max-width: 52ch;
    margin-top: 16px;
    line-height: 1.6;
  }

  /* MAP SECTION */
  .map-section { padding-bottom: clamp(56px, 8vw, 104px); }

  .map-wrapper {
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    background: var(--bg-2);
  }

  .map-wrapper iframe,
  .map-wrapper > div { width: 100% !important; }

  /* Wanderlog embed attribution strip */
  #Wanderlog__mapEmbed_mbflqwhogi {
    font-size: 13px !important;
    color: var(--text-faint) !important;
  }
  #Wanderlog__mapEmbed_mbflqwhogi a { color: var(--accent) !important; }
  #Wanderlog__mapEmbed_mbflqwhogi > div:first-child {
    padding: 12px 20px 0;
    font-family: var(--mono);
    font-size: 12px !important;
  }

  .map-min-height { min-height: 560px; }
</style>
</head>
<body>

<!-- NAV -->
<header id="site-header">
  <div class="wrap nav">
    <a href="../" class="brand"><span class="mark">~</span>Jon</a>
    <nav class="nav-links">
      <a href="../#apps">Apps</a>
      <a href="../#resources">Resources</a>
      <a href="../#blog">Blog</a>
      <a href="../#about">About</a>
    </nav>
    <div class="nav-tools">
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
    </div>
  </div>
</header>

<main>

  <!-- PAGE HERO -->
  <div class="page-hero wrap">
    <p class="breadcrumb"><a href="../">~jon</a> / travel</p>
    <span class="tag">Places I've been</span>
    <h1>Travel <span style="color:var(--accent)">Map</span></h1>
    <p>An interactive map of trips and places I've explored, powered by Wanderlog.</p>
  </div>

  <!-- MAP -->
  <section class="map-section wrap">
    <div class="map-wrapper map-min-height">
      <div id="Wanderlog__mapEmbed_mbflqwhogi" style="display: block; width: 100%">
        <div style="font-size: smaller; margin-bottom: 8px">This map was made with <a href="https://wanderlog.com/" target="_blank" rel="noopener">Wanderlog</a>, a road trip planner app on <a href="https://apps.apple.com/us/app/wanderlog/id1476732439" target="_blank" rel="noopener">iOS</a> and <a href="https://play.google.com/store/apps/details?id=com.wanderlog.android" target="_blank" rel="noopener">Android</a></div>
      </div>
    </div>
  </section>

</main>

<script>
  // Theme toggle (mirrors index.html)
  const root = document.documentElement;
  const btn = document.getElementById('theme-toggle');
  const icon = document.getElementById('theme-icon');

  function setTheme(t) {
    root.setAttribute('data-theme', t);
    localStorage.setItem('theme', t);
    icon.innerHTML = t === 'dark'
      ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
      : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }

  const saved = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  setTheme(saved);
  btn.addEventListener('click', () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

  // Sticky header border
  const header = document.getElementById('site-header');
  window.addEventListener('scroll', () => header.classList.toggle('scrolled', scrollY > 10), { passive: true });

  // Wanderlog embed
  window.wanderlogEmbedKeys = window.wanderlogEmbedKeys || [];
  window.wanderlogEmbedKeys.push('mbflqwhogi');
  window.wanderlogEmbedOptions = { alwaysShowRouteLines: true, version: 2 };
  (function() {
    var scripts = document.querySelectorAll('script');
    var alreadyLoaded = false;
    scripts.forEach(function(s) {
      if (s.src === 'https://wanderlog.com/embed.js') alreadyLoaded = true;
    });
    if (!alreadyLoaded) {
      var t = document.createElement('script');
      t.async = true;
      t.src = 'https://wanderlog.com/embed.js';
      document.body.appendChild(t);
    }
  })();
</script>
</body>
</html>
